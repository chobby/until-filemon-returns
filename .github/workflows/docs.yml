# Purpose: CI for the VitePress site (verify build on PR; deploy to GitHub Pages only on push to the default branch).

name: Documentation site

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAGES_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}

jobs:
  build_documentation_site:
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies with a clean install
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Upload build output as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist

  deploy_github_pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - build_documentation_site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_github_pages.outputs.page_url }}
    steps:
      - name: Download VitePress build output
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: vitepress-dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vitepress-dist

      - name: Deploy to GitHub Pages
        id: deploy_github_pages
        uses: actions/deploy-pages@v4
